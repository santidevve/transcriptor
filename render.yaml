services:
  - type: web
    name: transcriptor-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements-web.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 900
    healthCheckPath: /api/saludo/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WHISPER_MODEL
        value: tiny
      - key: CORS_ALLOWED_ORIGINS
        value: https://transcriptor-movil.vercel.app
